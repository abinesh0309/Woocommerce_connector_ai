[project]
name = "woo-connector"
version = "0.1.0"
description = "Production-grade, read-only WooCommerce connector (MCP server) for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ email = "abinesh0309@gmail.com" }]
maintainers = [{ email = "abinesh0309@gmail.com" }]
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.2",
    "pydantic>=2.11",
    "starlette>=0.46",
    "uvicorn>=0.34",
]

[project.scripts]
woo-connector = "woo_connector.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "respx>=0.22",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/woo_connector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E731"]
"scripts/*" = ["E501", "E402", "E731"]
